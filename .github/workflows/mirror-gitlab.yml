name: Mirror to GitLab

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: mirror-gitlab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror GitHub -> GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH for GitLab
        env:
          GITLAB_SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$GITLAB_SSH_PRIVATE_KEY" > ~/.ssh/gitlab_mirror
          chmod 600 ~/.ssh/gitlab_mirror
          ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Push all branches and tags to GitLab
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/gitlab_mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
        run: |
          git remote add gitlab git@gitlab.com:BENDER_5000/scripts_utiles_linux.git

          # actions/checkout convierte en lightweight la etiqueta del evento al hacer checkout.
          # Volvemos a traer las ramas y las etiquetas anotadas reales desde GitHub.
          git fetch --force --prune --prune-tags --tags origin

          # El fetch recrea origin/HEAD; si se empuja crearia una rama "HEAD" invalida en GitLab.
          git update-ref -d refs/remotes/origin/HEAD || true

          # Espeja todas las ramas, borrando en GitLab las que ya no existan en GitHub.
          git push --force --prune gitlab "+refs/remotes/origin/*:refs/heads/*"

          # GitLab rechaza actualizar etiquetas ya existentes. Creamos solo las nuevas
          # y conservamos las que ya estan en GitLab (incluidas las de las releases).
          git ls-remote --tags gitlab \
            | awk '{print $2}' \
            | sed 's#^refs/tags/##; s#\^{}$##' \
            | sort -u > /tmp/gitlab_tags.txt

          for tag in $(git tag); do
            if grep -qx "$tag" /tmp/gitlab_tags.txt; then
              echo "Etiqueta ya existente en GitLab (se conserva): $tag"
            else
              echo "Creando etiqueta en GitLab: $tag"
              git push gitlab "refs/tags/${tag}:refs/tags/${tag}"
            fi
          done
